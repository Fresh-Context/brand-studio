# Fresh Context Studio — reference Coolify stack: standalone Studio app plus
# a separate oauth2-proxy resource in front of the human browser door.
#
# Topology:
#   internet → Coolify proxy (TLS, studio.freshcontext.ai) → oauth2-proxy:4180
#     ├─ UI + /files/* → Google OAuth, @freshcontext.ai only → studio:3440
#     ├─ /api/*         → studio:3440, app bearer policy (machine/API door)
#     ├─ /mcp*          → studio:3440, app Authorization: Bearer policy
#     └─ /healthz       → studio:3440, public liveness only
#
# The studio container is not exposed publicly. In production the oauth2-proxy
# may be a separate Coolify resource attached to the same private network; this
# compose file remains a reproducible local/reference topology. Secrets are
# supplied by Coolify environment variables or an untracked local .env file.

services:
  studio:
    build: .
    restart: unless-stopped
    environment:
      - PORT=3440
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STUDIO_BEARER_TOKEN=${STUDIO_BEARER_TOKEN}
      - STUDIO_DOWNLOAD_SIGNING_SECRET=${STUDIO_DOWNLOAD_SIGNING_SECRET:-}
      - STUDIO_API_URL=https://studio.freshcontext.ai
      - STUDIO_MCP_REQUEST_TIMEOUT_MS=180000
      - STUDIO_GENERATED_DIR=/data/generated
      - STUDIO_REFERENCES_DIR=/data/references
      - STUDIO_LIBRARY_DIR=/data/library
    volumes:
      - studio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3440/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    restart: unless-stopped
    depends_on:
      - studio
    environment:
      - OAUTH2_PROXY_PROVIDER=google
      - OAUTH2_PROXY_CLIENT_ID=${OAUTH2_PROXY_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_PROXY_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_PROXY_COOKIE_SECRET}
      - OAUTH2_PROXY_EMAIL_DOMAINS=freshcontext.ai
      - OAUTH2_PROXY_REDIRECT_URL=https://studio.freshcontext.ai/oauth2/callback
      - OAUTH2_PROXY_UPSTREAMS=http://studio:3440
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      # Machine routes are passed to Studio, which enforces bearer auth itself.
      - OAUTH2_PROXY_SKIP_AUTH_ROUTES=^/(?:api/|mcp(?:/|$)|healthz$)
      - OAUTH2_PROXY_UPSTREAM_TIMEOUT=180s
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true

volumes:
  studio-data:
